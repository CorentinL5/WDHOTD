# Adapt server_name, TLS certificate paths, document root and PHP socket.
# Publish only the generated release's public/ directory.
limit_req_zone $binary_remote_addr zone=wdhotd_api:10m rate=5r/s;

server {
    listen 80;
    server_name YOUR_PUBLIC_DOMAIN;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 308 https://YOUR_PUBLIC_DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    server_name YOUR_PUBLIC_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_PUBLIC_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_PUBLIC_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/wdhotd/current/public;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ (^|/)\. { return 404; }
    location ~ ^/(data-cache|tests|scripts|tmp|deploy|logs|dist)/ { return 404; }
    location ~ \.(sql|env|log|ini|bak|md|yml|yaml)$ { return 404; }

    location ~ ^/(index|feed|stats|calendar|sponsor|metrics)\.php$ {
        limit_req zone=wdhotd_api burst=20 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
