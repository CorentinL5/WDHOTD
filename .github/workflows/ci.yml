name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wdhotd_test
          MYSQL_ROOT_PASSWORD: wdhotd-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p'wdhotd-test-only'"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl
          coverage: none
      - name: Syntax and image rules
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/feed.js
          node --check assets/js/collection.js
          node --test tests/collection.test.cjs
          php tests/images.php
          php tests/metrics.php
      - name: Prepare isolated database and published fixtures
        run: |
          printf '%s\n' 'DB_HOST_LOCAL=127.0.0.1' 'DB_USER_LOCAL=root' 'DB_PASS_LOCAL=wdhotd-test-only' 'DB_NAME_LOCAL=wdhotd_test' 'APP_ENV=testing' 'APP_DEBUG=false' > .env
          php tests/seed.php
          php migrate.php
          php export.php
          php tests/package.php
      - name: HTTP and cache integration
        run: |
          WDHOTD_METRICS_DIR="$RUNNER_TEMP/wdhotd-metrics" php -S 127.0.0.1:8000 > /tmp/wdhotd-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          php tests/smoke.php http://127.0.0.1:8000
